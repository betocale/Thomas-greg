<link rel="stylesheet" href="inicio-seccion.css">
<link rel="stylesheet" href="/Thomas/src/app/app.css">

<main class="main">
  <div class="content login-container">
    
    <!-- LADO IZQUIERDO: BIENVENIDA / REGRESO -->
    <div class="left-side">
      <div class="brand-badge">📦 Beto Shop</div>
      <h1>Bienvenido de nuevo <br><span class="gradient-text">Inicia Sesión</span></h1>
      <p>
        Accede a tu panel de control para seguir gestionando productos, inventario, pedidos y reportes con total seguridad.
      </p>

      <div class="cta-buttons">
        <button type="button" class="btn-secondary" [routerLink]="['/']">
          ← Volver al inicio
        </button>
      </div>
    </div>

    <div class="divider" role="separator" aria-label="Divider"></div>

    <!-- LADO DERECHO: FORMULARIO DE INICIO DE SESIÓN -->
    <div class="right-side">
      <h2 class="modules-title">Credenciales de Acceso</h2>
      
      <form class="login-form" (submit)="onSubmit($event)">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input 
            type="email" 
            id="email" 
            placeholder="admin@betoshop.com" 
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input 
            type="password" 
            id="password" 
            placeholder="••••••••" 
            required
          >
        </div>

        <div class="buttons-login">

        <button type="submit" class="btn-primary btn-submit">
          Entrar a la Plataforma
        </button>
        
        <button type="button" class="btn-secondary btn-register" (click)="irARegistro()">
          Crear una cuenta
        </button>

       </div>

      </form>
    </div>

  </div>
</main>


<router-outlet></router-outlet>
